[workspace]
resolver = "3"
members = ["core", "view-prices", "live-prices", "lag-recorder", "live-trader", "live-itm", "feature-recorder"]

[workspace.dependencies]
polymarket_client_sdk_v2 = { version = "0.5", features = ["clob", "gamma", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
anyhow = "1"
rust_decimal = "1"
alloy-primitives = "1"
futures = "0.3"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
