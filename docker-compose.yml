# Convenience wrapper for the containerized traders.
#
#   Build:        docker compose build
#   Dry (safe):   docker compose up                 (starts dry-trader only —
#                                                    no wallet, nothing posted)
#   Book data:    docker compose --profile features up -d   (dry + recorder;
#                                                    walletless, no position)
#   GO LIVE:      docker compose --profile live up -d      (dry + live), or
#                 docker compose run --rm live-trader <flags>  (live one-off)
#
# The private key is supplied at runtime via the environment (a local .env file
# holding POLY_PRIVATE_KEY, or your shell). It is never written into the image.

services:
  # SAFE DEFAULT: same entry strategy as live-trader but nothing is posted —
  # no wallet, no sizing, per-share pnl in live-itm's CSV schema. Its built-in
  # defaults are already loose for data collection. Plain `docker compose up`
  # starts only this service.
  dry-trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-live-trader
    entrypoint: ["/usr/local/bin/dry-trader"]
    environment:
      TZ: ${TZ:-UTC}
    # Dry CSVs land in ./dry-data on the host, separate from real fills.
    volumes:
      - ./dry-data:/app/dry-data
    # Optional strategy flags, e.g. to mirror live-trader's strict criteria:
    # ["--min-ask", "0.95", "--min-target-dist", "45"]
    command: []
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    # Headroom, not a fix: window resolvers each hold a socket while polling PM
    # for up to 20 minutes, so a burst of pending windows is normally fine but
    # sits close to the 1024 default. The runaway that actually exhausted this
    # on 2026-07-25 is fixed in the rollover dispatch guard.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # INVERSE experiment. Walletless (dry-trader), so nothing is ever posted.
  #
  # Takes the OTHER SIDE of the baseline trade. Baseline buys the side the BTC
  # median favors at a rich ask (0.94–0.99) and collects a few cents when the
  # price doesn't cross back. This buys the side the median does NOT favor at a
  # cheap ask (~0.01–0.06) and collects ~0.95 when it DOES cross back. Same
  # windows, opposite bet.
  #
  # Why: cleaned out-of-sample data through 2026-07-27 says edge falls as
  # distance from the strike grows — the favored side is priced too rich when
  # BTC is far out. If that's real, its mirror is that the cheap side is priced
  # too thin, and a longshot at 0.03 only needs a 3% cross-back rate to break
  # even.
  #
  # Every gate below has to move together; two of them make the trade
  # impossible on their own:
  #   --invert-direction  take the side the median opposes (the trade itself)
  #   --min-ask/--max-ask band (0, 0.06] — the baseline's 0.94–0.99 band can
  #                       never match an unfavored side, so leaving it alone
  #                       means zero entries, not a longshot
  #   --min-bid 0.01      the 0.50 default is above the entire longshot price
  #                       range and would reject every single tick
  #   (no --max-target-dist) — the near-strike cap contradicts this: a 3-cent
  #                       side only exists when BTC is FAR from the strike.
  #                       Near the strike both sides price near 0.50.
  #
  #   docker compose --profile inverse up -d
  #
  # Shares the baseline's ./dry-data mount (already writable by uid 10001) and
  # separates itself by FILENAME instead: --out-prefix makes it write
  # inverse-trade-<stamp>.csv, which the analysis' trade*.csv glob does not
  # match, so the two runs never mix. Loading them is
  # load_dry(pattern="inverse-trade*.csv").
  dry-inverse:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-live-trader
    profiles: ["inverse"]
    entrypoint: ["/usr/local/bin/dry-trader"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./dry-data:/app/dry-data
    # --max-offset 300 (vs the 290 default) opens the final 10 seconds; the
    # gate is exclusive (offset >= max is rejected), so this admits offsets
    # 290–299. Note this cuts BOTH ways for a longshot: the cheapest asks are
    # in the last seconds, but a cross-back also has the least time to happen.
    command:
      - "--invert-direction"
      - "--min-ask"
      - "0"
      - "--max-ask"
      - "0.06"
      - "--min-bid"
      - "0.01"
      - "--max-offset"
      - "300"
      - "--out-prefix"
      - "inverse-trade"
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ORDER-BOOK RECORDER. Takes no position and posts nothing — it is not a
  # trader at all, it only samples the market. Walletless.
  #
  # Why this exists: every trade CSV (live, dry, inverse) records exactly ONE
  # price — the ask that was paid. That is enough to measure a taker's edge and
  # nothing else, which is why ~5.9k logged trades can only answer the one
  # question they already answered (edge ≈ −half the spread, signal ≈ 0). This
  # binary is the only thing in the workspace that captures the OTHER side of
  # the book plus resting sizes:
  #
  #   yes_bid/yes_bid_size/yes_ask/yes_ask_size/yes_last  (and the NO mirror)
  #   book_tightness = 1 − (yes_bid + no_bid)   <-- the BID-side gap
  #
  # Note book_tightness is the bid-side complement of the ask-side overround
  # (yes_ask + no_ask − 1 ≈ 1.09pp) that the trade CSVs imply. Together the two
  # bracket the entire region a MAKER could quote into, which no existing
  # dataset covers. It also logs won / pnl_if_entered per sampled tick, so
  # adverse selection (do resting orders only fill when the move is about to go
  # against you?) is measurable from this file alone.
  #
  #   docker compose --profile features up -d
  #
  # working_dir instead of --out: the binary's --out takes a fixed path and
  # File::create TRUNCATES, so with restart: unless-stopped a container restart
  # would silently wipe the file. Given no --out it falls back to
  # features-<unix_ts>.csv in the CWD, so pointing CWD at the mount gives one
  # fresh timestamped file per start and never clobbers a previous run.
  feature-recorder:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-live-trader
    profiles: ["features"]
    entrypoint: ["/usr/local/bin/feature-recorder"]
    working_dir: /app/feature-data
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./feature-data:/app/feature-data
    # --min-offset 120 samples the last 3 minutes of each window at 1s ticks
    # (the 180 default gives only 2). The extra minute is deliberate: a maker
    # rests an order BEFORE the 240–260s region where entries actually trigger,
    # so measuring adverse selection needs book history from before the fill,
    # not just at it. Costs ~2 rows/sec/window of CSV.
    command: ["--min-offset", "120"]
    # Same graceful-shutdown contract as the traders: SIGINT (set via the
    # image's STOPSIGNAL) drains in-flight window resolutions and flushes the
    # CSV. Without the grace period the last window's rows are lost.
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    # See the dry-trader note: headroom for concurrent window resolvers.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # REAL orders. Gated behind the "live" profile so `docker compose up` can
  # never start it by accident; opt in with --profile live or `compose run`.
  live-trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-live-trader
    profiles: ["live"]
    environment:
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY:-}
      # Polymarket proxy wallet address (public, constant). Signing is done by
      # POLY_PRIVATE_KEY; funds/positions live in this proxy. Leave blank if your
      # account has no proxy (signing wallet is the funder).
      POLY_FUNDER: ${POLY_FUNDER:-}
      # CLOB signature type matching the funder wallet: 0=EOA, 1=Proxy(email/magic),
      # 2=GnosisSafe(browser-wallet proxy e.g. Phantom), 3=Poly1271(deposit wallet).
      # Must be set (2 or 3) whenever POLY_FUNDER is a proxy, or orders get rejected.
      POLY_SIG_TYPE: ${POLY_SIG_TYPE:-}
      # Pre-issued CLOB API creds (Polymarket "API keys" screen). Set all three to
      # inject them directly, bypassing the EOA-bound key derivation that breaks
      # the deposit-wallet/Poly1271 flow. Leave blank to derive from the signer.
      POLY_API_KEY: ${POLY_API_KEY:-}
      POLY_API_SECRET: ${POLY_API_SECRET:-}
      POLY_API_PASSPHRASE: ${POLY_API_PASSPHRASE:-}
      TZ: ${TZ:-UTC}
    # CSVs land in ./data on the host (Docker Desktop bind mounts ignore the
    # container uid, so writes work regardless of ownership).
    volumes:
      - ./data:/app/data
    # Strategy flags, e.g. --notional 1 --min-target-dist 35.
    command: ["--notional", "1"]
    # Give the graceful SIGINT shutdown room to settle/cancel orders, resolve
    # the final window, and flush the CSV before the container is killed.
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    # See the dry-trader note: headroom for concurrent window resolvers.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
