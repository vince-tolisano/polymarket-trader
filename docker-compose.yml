# Convenience wrapper for the containerized traders.
#
#   Build:        docker compose build
#   Dry (safe):   docker compose up                 (starts dry-trader only —
#                                                    no wallet, nothing posted)
#   GO LIVE:      docker compose --profile live up -d      (dry + live), or
#                 docker compose run --rm live-trader <flags>  (live one-off)
#
# The private key is supplied at runtime via the environment (a local .env file
# holding POLY_PRIVATE_KEY, or your shell). It is never written into the image.

services:
  # SAFE DEFAULT: same entry strategy as live-trader but nothing is posted —
  # no wallet, no sizing, per-share pnl in live-itm's CSV schema. Its built-in
  # defaults are already loose for data collection. Plain `docker compose up`
  # starts only this service.
  dry-trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-live-trader
    entrypoint: ["/usr/local/bin/dry-trader"]
    environment:
      TZ: ${TZ:-UTC}
    # Dry CSVs land in ./dry-data on the host, separate from real fills.
    volumes:
      - ./dry-data:/app/dry-data
    # Optional strategy flags, e.g. to mirror live-trader's strict criteria:
    # ["--min-ask", "0.95", "--min-target-dist", "45"]
    command: []
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    # Headroom, not a fix: window resolvers each hold a socket while polling PM
    # for up to 20 minutes, so a burst of pending windows is normally fine but
    # sits close to the 1024 default. The runaway that actually exhausted this
    # on 2026-07-25 is fixed in the rollover dispatch guard.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # INVERSE experiment. Walletless (dry-trader), so nothing is ever posted.
  #
  # The baseline strategy buys the favored side FAR from the strike. Cleaned
  # out-of-sample data through 2026-07-27 says edge falls as distance grows —
  # the ask more than prices the distance in — and the only positive slice is
  # dist < 10 (+2.6pp over 190 trades, p=0.05 uncorrected, UNVALIDATED). This
  # service caps distance instead of flooring it and changes nothing else, so
  # its rows are directly comparable to the baseline dry-trader's.
  #
  # Why a separate run rather than filtering the baseline afterwards: the
  # trigger takes the FIRST qualifying tick and then locks the window. With no
  # cap, a window that starts far from the strike triggers early and locks, so
  # near-strike entries are only recorded when the window happened to be near
  # the strike at trigger time. Capping distance lets those windows stay open
  # and capture entries the baseline structurally cannot see.
  #
  #   docker compose --profile inverse up -d
  #
  # Mounted at the container's default dry-data/ so the binary keeps its own
  # timestamped filenames; only the host directory differs, which keeps these
  # CSVs from mixing with the baseline run's.
  dry-inverse:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-live-trader
    profiles: ["inverse"]
    entrypoint: ["/usr/local/bin/dry-trader"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./inverse-data:/app/dry-data
    # Ask band left at the dry default (0.94, 0.99] on purpose: the distance
    # cap already selects low asks (the market is least certain near the
    # strike), so leaving the band wide keeps ask and distance separable in
    # analysis instead of confounding them up front.
    command: ["--max-target-dist", "10"]
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # REAL orders. Gated behind the "live" profile so `docker compose up` can
  # never start it by accident; opt in with --profile live or `compose run`.
  live-trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: polymarket-live-trader
    profiles: ["live"]
    environment:
      POLY_PRIVATE_KEY: ${POLY_PRIVATE_KEY:-}
      # Polymarket proxy wallet address (public, constant). Signing is done by
      # POLY_PRIVATE_KEY; funds/positions live in this proxy. Leave blank if your
      # account has no proxy (signing wallet is the funder).
      POLY_FUNDER: ${POLY_FUNDER:-}
      # CLOB signature type matching the funder wallet: 0=EOA, 1=Proxy(email/magic),
      # 2=GnosisSafe(browser-wallet proxy e.g. Phantom), 3=Poly1271(deposit wallet).
      # Must be set (2 or 3) whenever POLY_FUNDER is a proxy, or orders get rejected.
      POLY_SIG_TYPE: ${POLY_SIG_TYPE:-}
      # Pre-issued CLOB API creds (Polymarket "API keys" screen). Set all three to
      # inject them directly, bypassing the EOA-bound key derivation that breaks
      # the deposit-wallet/Poly1271 flow. Leave blank to derive from the signer.
      POLY_API_KEY: ${POLY_API_KEY:-}
      POLY_API_SECRET: ${POLY_API_SECRET:-}
      POLY_API_PASSPHRASE: ${POLY_API_PASSPHRASE:-}
      TZ: ${TZ:-UTC}
    # CSVs land in ./data on the host (Docker Desktop bind mounts ignore the
    # container uid, so writes work regardless of ownership).
    volumes:
      - ./data:/app/data
    # Strategy flags, e.g. --notional 1 --min-target-dist 35.
    command: ["--notional", "1"]
    # Give the graceful SIGINT shutdown room to settle/cancel orders, resolve
    # the final window, and flush the CSV before the container is killed.
    stop_grace_period: 30s
    init: true
    restart: unless-stopped
    # See the dry-trader note: headroom for concurrent window resolvers.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
